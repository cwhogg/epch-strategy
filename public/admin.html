<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Visitor Analytics — Admin</title>
<style>
  :root {
    --bg: #faf9f6;
    --panel: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --muted: #8a8a8a;
    --border: #e8e4dc;
    --border-strong: #c9c2b3;
    --accent: #c2410c;
    --accent-soft: #fff1ea;
    --accent-ink: #7a2807;
    --green: #15803d;
    --green-soft: #e8f5ec;
    --blue: #1d4ed8;
    --blue-soft: #eaf0fd;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 28px 80px; }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 28px;
    line-height: 1.2;
    margin: 0 0 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  /* Dashboard */

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .stat-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
  }

  /* Table */
  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 12px 16px;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--ink-soft);
    max-width: 300px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--accent-soft); }

  .back-link {
    display: inline-block;
    margin-bottom: 16px;
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  .back-link:hover { text-decoration: underline; }

  .refresh-btn {
    padding: 6px 14px;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-soft);
    float: right;
  }
  .refresh-btn:hover { background: var(--accent-soft); }
</style>
</head>
<body>
<div class="wrap">

  <div id="dashboard">
    <a href="/" class="back-link">&larr; Back to site</a>
    <button class="refresh-btn" onclick="loadData()">Refresh</button>
    <div class="eyebrow">Admin</div>
    <h1>Visitor Analytics</h1>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Visits</div>
        <div class="stat-value" id="stat-total">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Unique IPs</div>
        <div class="stat-value" id="stat-ips">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Time on Site</div>
        <div class="stat-value" id="stat-time">--</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>IP</th>
            <th>Location</th>
            <th>Timestamp</th>
            <th>Time on Site</th>
            <th>User Agent</th>
          </tr>
        </thead>
        <tbody id="visit-table"></tbody>
      </table>
    </div>
  </div>

</div>
<script>
  async function loadData() {
    try {
      const resp = await fetch('/api/visits');
      if (!resp.ok) {
        console.error('Server error', resp.status);
        return;
      }
      const data = await resp.json();
      showDashboard(data.visits || []);
    } catch (err) {
      console.error('Network error', err);
    }
  }

  loadData();

  function formatDuration(seconds) {
    if (!seconds || seconds <= 0) return '--';
    if (seconds < 60) return seconds + 's';
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    return m + 'm ' + s + 's';
  }

  function showDashboard(visits) {
    // Stats
    document.getElementById('stat-total').textContent = visits.length;

    var uniqueIPs = new Set(visits.map(function(v) { return v.ip; }));
    document.getElementById('stat-ips').textContent = uniqueIPs.size;

    var durationsWithTime = visits.filter(function(v) { return v.duration > 0; });
    var avgTime = 0;
    if (durationsWithTime.length > 0) {
      var total = durationsWithTime.reduce(function(sum, v) { return sum + v.duration; }, 0);
      avgTime = Math.round(total / durationsWithTime.length);
    }
    document.getElementById('stat-time').textContent = formatDuration(avgTime);

    // Table
    var tbody = document.getElementById('visit-table');
    tbody.innerHTML = '';
    visits.forEach(function(v, i) {
      var tr = document.createElement('tr');
      var ts = new Date(v.timestamp);
      var timeStr = ts.toLocaleDateString() + ' ' + ts.toLocaleTimeString();
      tr.innerHTML =
        '<td>' + (i + 1) + '</td>' +
        '<td>' + escapeHtml(v.ip) + '</td>' +
        '<td>' + escapeHtml(v.location || '--') + '</td>' +
        '<td>' + escapeHtml(timeStr) + '</td>' +
        '<td>' + formatDuration(v.duration) + '</td>' +
        '<td title="' + escapeAttr(v.userAgent) + '">' + escapeHtml(v.userAgent) + '</td>';
      tbody.appendChild(tr);
    });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
</script>
</body>
</html>
